# Netlify Configuration for Integration Boutique

[build]
  publish = "."
  command = "echo 'No build required - static site'"

# Form notifications - sends to your email
[[plugins]]
  package = "@netlify/plugin-form-notifications"

# Email notification settings for form submissions
[plugins.inputs]
  # Email will be sent to this address
  to = "connect@integrationboutique.com"
  # Subject will be dynamically set by form submission
  # Format: 🎯 New Consultation: [Company Name] - [Service]

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect rules (if needed)
# [[redirects]]
#   from = "/old-path"
#   to = "/new-path"
#   status = 301
